<!DOCTYPE html>
<html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SIPEKA Sarpras - Google Sheets</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:sans-serif}
body{background:#f8fafc}.header{background:#1e3a5f;color:#fff;padding:14px 20px;display:flex;justify-content:space-between;align-items:center}
.btn{border:0;padding:9px 14px;border-radius:8px;font-weight:700;cursor:pointer;font-size:13px}
.btn-blue{background:#2563eb;color:#fff}.btn-white{background:#fff;border:1px solid #ddd}
.container{padding:16px;max-width:1100px;margin:0 auto}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}
.stat{background:#fff;padding:12px;border-radius:10px;border:1px solid #e5e7eb;text-align:center;cursor:pointer}
.stat.active{border:2px solid #2563eb}.stat b{font-size:20px;display:block}
.table-box{background:#fff;border-radius:10px;padding:14px;border:1px solid #e5e7eb;overflow:auto}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:850px}
th,td{padding:9px;border-bottom:1px solid #eee;text-align:left}
.badge{padding:3px 7px;border-radius:5px;font-size:11px}.menunggu{background:#fef9c3}.dikerjakan{background:#dbeafe}.selesai{background:#dcfce7}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;padding:10px;z-index:99}.modal.on{display:flex}
.form{background:#fff;width:100%;max-width:400px;border-radius:12px;padding:16px;max-height:90vh;overflow:auto}
.form input,.form select,.form textarea{width:100%;padding:8px;border:1px solid #ddd;border-radius:6px;margin-top:4px;font-size:13px}
.form label{font-size:11px;color:#666;margin-top:10px;display:block;font-weight:700}
#preview{width:100%;height:100px;object-fit:cover;border-radius:6px;display:none;margin-top:6px}
.loading{text-align:center;padding:20px;color:#666;font-size:13px}
</style></head><body>
<div class="header"><div>🛠️ <b>SIPEKA</b> Sarpras Sekolah</div><button class="btn btn-blue" onclick="openAdd()">+ Lapor Rusak</button></div>
<div class="container">
<div class="stats">
<div class="stat active" onclick="filterStatus('all')" id="c-all"><small>Total</small><b id="t-total">0</b></div>
<div class="stat" onclick="filterStatus('Menunggu')" id="c-menunggu"><small>Menunggu</small><b id="t-menunggu">0</b></div>
<div class="stat" onclick="filterStatus('Dikerjakan')" id="c-dikerjakan"><small>Dikerjakan</small><b id="t-dikerjakan">0</b></div>
<div class="stat" onclick="filterStatus('Selesai')" id="c-selesai"><small>Selesai</small><b id="t-selesai">0</b></div>
</div>
<div class="table-box">
<input id="q" placeholder="Cari unit kerja / lokasi / barang..." style="padding:8px;border:1px solid #ddd;border-radius:20px;width:100%;max-width:300px;margin-bottom:10px" oninput="render()">
<div id="loading" class="loading">Memuat data dari Google Sheets...</div>
<table><thead><tr><th>Tgl</th><th>Unit Kerja</th><th>Barang</th><th>Lokasi</th><th>Pelapor</th><th>Status</th><th>Aksi</th></tr></thead><tbody id="tbody"></tbody></table>
</div>
</div>

<div class="modal" id="modal"><div class="form">
<h3 id="mtitle">Lapor Baru</h3>
<label>Unit Kerja *</label><select id="unit"><option>Umum - TU</option><option>Kurikulum</option><option>Kesiswaan</option><option>Sarpras</option><option>Humas</option><option>Lab / Perpus</option><option>Keamanan</option></select>
<label>Nama Barang / Fasilitas *</label><input id="nama">
<label>Lokasi *</label><input id="lokasi">
<label>Pelapor</label><input id="pelapor">
<label>Prioritas</label><select id="prioritas"><option>Rendah</option><option>Sedang</option><option>Tinggi</option><option>Darurat</option></select>
<label>Deskripsi *</label><textarea id="deskripsi" rows="3"></textarea>
<label>Status</label><select id="status"><option>Menunggu</option><option>Dikerjakan</option><option>Selesai</option></select>
<label>Tgl</label><input id="tgl" type="date">
<label>Foto (opsional, jangan besar)</label><input type="file" id="foto" accept="image/*"><img id="preview">
<div style="display:flex;gap:8px;margin-top:14px"><button class="btn btn-white" style="flex:1" onclick="closeM()">Batal</button><button class="btn btn-blue" style="flex:1" onclick="saveData()" id="btnSave">Simpan</button></div>
<p id="err" style="color:red;font-size:12px;display:none;margin-top:8px"></p>
</div></div>

<div class="modal" id="modalDetail"><div class="form">
<div style="display:flex;justify-content:space-between"><h3 id="dNama"></h3><span onclick="document.getElementById('modalDetail').classList.remove('on')" style="cursor:pointer">✕</span></div>
<img id="dFoto" style="width:100%;height:150px;object-fit:cover;border-radius:8px;display:none;margin:8px 0">
<p style="font-size:13px;margin-top:8px"><b>Unit Kerja:</b> <span id="dUnit"></span><br><b>Lokasi:</b> <span id="dLokasi"></span><br><b>Pelapor:</b> <span id="dPelapor"></span><br><b>Tgl:</b> <span id="dTgl"></span><br><b>Status:</b> <span id="dStatus"></span></p>
<p style="font-size:13px;margin-top:8px;background:#f8fafc;padding:8px;border-radius:6px"><span id="dDesk"></span></p>
<div style="display:flex;gap:8px;margin-top:12px"><button class="btn btn-white" style="flex:1" onclick="document.getElementById('modalDetail').classList.remove('on')">Tutup</button><button class="btn btn-blue" style="flex:1" id="btnEdit">Edit</button></div>
</div></div>

<script>
// ==============================================
// https://script.google.com/a/macros/his.sch.id/s/AKfycby4ZcfEvkl75M3dpiReaoFQLuZjJWw_xKrd6tZOTNoqad1lFPQDLZ8p7Jibfm_HjFolIQ/exec:?data=%7B%22unit%22%3A%22TEST%22%2C%22nama%22%3A%22Kursi%22%2C%22lokasi%22%3A%22Lab%22%2C%22deskripsi%22%3A%22Rusak%22%2C%22pelapor%22%3A%22Andi%22%2C%22prioritas%22%3A%22Sedang%22%2C%22tgl%22%3A%222026-01-01%22%2C%22status%22%3A%22Baru%22%7D
const API_URL = 'https://script.google.com/a/macros/his.sch.id/s/AKfycby4ZcfEvkl75M3dpiReaoFQLuZjJWw_xKrd6tZOTNoqad1lFPQDLZ8p7Jibfm_HjFolIQ/exec?data=%7B%22unit%22%3A%22TEST%22%2C%22nama%22%3A%22Kursi%22%2C%22lokasi%22%3A%22Lab%22%2C%22deskripsi%22%3A%22Rusak%22%2C%22pelapor%22%3A%22Andi%22%2C%22prioritas%22%3A%22Sedang%22%2C%22tgl%22%3A%222026-01-01%22%2C%22status%22%3A%22Baru%22%7D:';
// ==============================================

let data=[], fotoTemp='', filter='all', editId=null;

document.getElementById('foto').addEventListener('change',function(e){
  let f=e.target.files[0]; if(!f) return;
  let r=new FileReader();
  r.onload=function(ev){ fotoTemp=ev.target.result; let p=document.getElementById('preview'); p.src=fotoTemp; p.style.display='block'; };
  r.readAsDataURL(f);
});

async function loadData(){
  try{
    const res = await fetch(API_URL);
    data = await res.json();
    document.getElementById('loading').style.display='none';
    render();
  }catch(e){
    document.getElementById('loading').innerText='Gagal load. Cek API_URL kamu met.';
  }
}

function filterStatus(s){
  filter=s;
  document.querySelectorAll('.stat').forEach(el=>el.classList.remove('active'));
  if(s=='all') document.getElementById('c-all').classList.add('active');
  else document.getElementById('c-'+s.toLowerCase()).classList.add('active');
  render();
}

function render(){
  let q=document.getElementById('q').value.toLowerCase(), tb=document.getElementById('tbody'); tb.innerHTML='';
  document.getElementById('t-total').innerText=data.length;
  document.getElementById('t-menunggu').innerText=data.filter(d=>d.status=='Menunggu').length;
  document.getElementById('t-dikerjakan').innerText=data.filter(d=>d.status=='Dikerjakan').length;
  document.getElementById('t-selesai').innerText=data.filter(d=>d.status=='Selesai').length;
  let list=data;
  if(filter!='all') list=list.filter(d=>d.status==filter);
  if(q) list=list.filter(d=>(d.unit+d.nama+d.lokasi+d.pelapor).toLowerCase().includes(q));
  list.forEach(d=>{
    tb.innerHTML+=`<tr style="cursor:pointer" onclick="openDetail(${d.id})"><td>${d.tgl}</td><td><b>${d.unit}</b></td><td>${d.nama}</td><td>${d.lokasi}</td><td>${d.pelapor}</td><td><span class="badge ${d.status.toLowerCase()}">${d.status}</span></td><td><span style="color:blue" onclick="event.stopPropagation();editData(${d.id})">Edit</span> | <span style="color:red" onclick="event.stopPropagation();hapusData(${d.id})">Hapus</span></td></tr>`;
  });
}

function openAdd(){
  editId=null;
  document.getElementById('mtitle').innerText='Lapor Baru';
  document.getElementById('unit').value='Umum - TU';
  document.getElementById('nama').value=''; document.getElementById('lokasi').value=''; document.getElementById('pelapor').value=''; document.getElementById('deskripsi').value='';
  document.getElementById('tgl').value=new Date().toISOString().slice(0,10);
  document.getElementById('preview').style.display='none'; fotoTemp=''; document.getElementById('err').style.display='none';
  document.getElementById('modal').classList.add('on');
}
function closeM(){ document.getElementById('modal').classList.remove('on'); }

async function saveData(){
  let nama=document.getElementById('nama').value.trim(), lokasi=document.getElementById('lokasi').value.trim(), deskripsi=document.getElementById('deskripsi').value.trim();
  if(!nama||!lokasi||!deskripsi){ document.getElementById('err').innerText='Nama, Lokasi, Deskripsi wajib isi met!'; document.getElementById('err').style.display='block'; return; }
  let btn=document.getElementById('btnSave'); btn.innerText='Menyimpan...'; btn.disabled=true;
  let payload={ action: editId===null?'add':'update', id: editId, unit:document.getElementById('unit').value, nama, lokasi, deskripsi, pelapor:document.getElementById('pelapor').value||'Anonim', prioritas:document.getElementById('prioritas').value, tgl:document.getElementById('tgl').value, status:document.getElementById('status').value, foto:fotoTemp };
  try {
    await fetch(API_URL, {
      method: 'POST',
      mode: 'no-cors',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(payload)
    });
  } catch(e) { console.log(e); }
  btn.innerText='Simpan'; btn.disabled=false; closeM();
  setTimeout(loadData, 2000);
}

function editData(id){
  let d=data.find(x=>x.id==id); if(!d) return; editId=id;
  document.getElementById('unit').value=d.unit; document.getElementById('nama').value=d.nama; document.getElementById('lokasi').value=d.lokasi; document.getElementById('pelapor').value=d.pelapor; document.getElementById('prioritas').value=d.prioritas; document.getElementById('deskripsi').value=d.deskripsi; document.getElementById('tgl').value=d.tgl; document.getElementById('status').value=d.status;
  fotoTemp=''; if(d.foto){ document.getElementById('preview').src=d.foto; document.getElementById('preview').style.display='block'; } else document.getElementById('preview').style.display='none';
  document.getElementById('mtitle').innerText='Edit Laporan'; document.getElementById('modal').classList.add('on');
}

async function hapusData(id){
  if(confirm('Hapus laporan ini?')){
    await fetch(API_URL,{method:'POST', body:JSON.stringify({action:'delete', id})});
    setTimeout(loadData,1500);
  }
}

function openDetail(id){
  let d=data.find(x=>x.id==id); if(!d) return;
  document.getElementById('dNama').innerText=d.nama; document.getElementById('dUnit').innerText=d.unit; document.getElementById('dLokasi').innerText=d.lokasi; document.getElementById('dPelapor').innerText=d.pelapor; document.getElementById('dTgl').innerText=d.tgl; document.getElementById('dStatus').innerText=d.status; document.getElementById('dDesk').innerText=d.deskripsi;
  if(d.foto){ document.getElementById('dFoto').src=d.foto; document.getElementById('dFoto').style.display='block'; } else document.getElementById('dFoto').style.display='none';
  document.getElementById('btnEdit').onclick=function(){ document.getElementById('modalDetail').classList.remove('on'); editData(id); };
  document.getElementById('modalDetail').classList.add('on');
}

loadData();
setInterval(loadData, 10000); // auto-refresh tiap 10 detik
</script>
</body></html>
